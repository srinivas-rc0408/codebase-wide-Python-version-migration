[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "Blind held-out fixture: a job scheduler whose clock and epoch must agree."
requires-python = "==3.12.*"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
